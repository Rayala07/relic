<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Save to Relic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="brand">
          <span class="badge">Relic AI Pipeline</span>
        </div>
        <h1 class="title">Save a resource</h1>
      </header>

      <main class="form-card">
        <div class="field">
          <input
            id="url-input"
            type="text"
            class="input"
            placeholder="https://..."
            autocomplete="off"
            autofocus
          />
        </div>

        <div class="field">
          <input
            id="title-input"
            type="text"
            class="input"
            placeholder="Custom Title (Optional)"
            autocomplete="off"
          />
        </div>

        <button id="save-btn" class="btn" disabled>SAVE TO LIBRARY &rarr;</button>

        <div id="status" class="status hidden"></div>
      </main>

      <footer class="footer">
        <span>Not working?</span>
        <a href="#" id="open-relic-btn" target="_blank" class="open-link">Log in to Relic</a>
      </footer>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
