<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Save to Relic</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <main class="form">
        <!-- Auth Reminder -->
        <div class="auth-reminder">
          Make sure you are logged in before saving.
          <a href="#" id="open-relic-btn" target="_blank" class="open-link">Open RELIC →</a>
        </div>

        <div class="field" style="margin-bottom: 16px;">
          <label for="title-input" class="label">TITLE</label>
          <input
            id="title-input"
            type="text"
            class="input"
            placeholder="Name this item..."
            autocomplete="off"
          />
        </div>

        <div class="field">
          <label for="url-input" class="label">URL</label>
          <input
            id="url-input"
            type="text"
            class="input"
            autocomplete="off"
          />
        </div>

        <button id="save-btn" class="btn" disabled>Save</button>

        <div id="status" class="status hidden"></div>
      </main>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
